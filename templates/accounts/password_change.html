{% extends 'base.html' %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{% trans "Change Password" %} - CLVRS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mb-4">
        <div class="card shadow-sm border-0 rounded-lg">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="fas fa-key me-2"></i>{% trans "Change Password" %}</h5>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-warning">{% trans "Update Password" %}</button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
